name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: darwin-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            suffix: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '.version = $v' deno.json > deno.json.tmp && mv deno.json.tmp deno.json

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile binary
        run: deno compile --allow-net --allow-read --allow-write --allow-env --allow-run --target ${{ matrix.target }} --output xp-${{ matrix.suffix }} main.ts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xp-${{ matrix.suffix }}
          path: xp-${{ matrix.suffix }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/*

  update-homebrew:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          repositories: homebrew-tap

      - name: Compute SHA256 for all binaries
        id: sha
        run: |
          TAG="${{ github.event.release.tag_name }}"
          BASE="https://github.com/tawachan/xp/releases/download/${TAG}"
          for suffix in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            curl -fsSL -L "${BASE}/xp-${suffix}" -o "/tmp/xp-${suffix}"
          done
          echo "darwin_arm64=$(sha256sum /tmp/xp-darwin-arm64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_x64=$(sha256sum /tmp/xp-darwin-x64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(sha256sum /tmp/xp-linux-x64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum /tmp/xp-linux-arm64 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: tawachan/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}

      - name: Update formula
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          cat > Formula/xp.rb << 'FORMULA'
          class Xp < Formula
            desc "Fast, minimal CLI for posting to X (Twitter) from your terminal"
            homepage "https://github.com/tawachan/xp"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/tawachan/xp/releases/download/vVERSION_PLACEHOLDER/xp-darwin-arm64"
                sha256 "SHA_DARWIN_ARM64"
              else
                url "https://github.com/tawachan/xp/releases/download/vVERSION_PLACEHOLDER/xp-darwin-x64"
                sha256 "SHA_DARWIN_X64"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/tawachan/xp/releases/download/vVERSION_PLACEHOLDER/xp-linux-arm64"
                sha256 "SHA_LINUX_ARM64"
              else
                url "https://github.com/tawachan/xp/releases/download/vVERSION_PLACEHOLDER/xp-linux-x64"
                sha256 "SHA_LINUX_X64"
              end
            end

            def install
              binary = Dir.glob("xp-*").first || "xp"
              bin.install binary => "xp"
            end

            test do
              assert_match "xp", shell_output("#{bin}/xp version")
            end
          end
          FORMULA

          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/xp.rb
          sed -i "s/SHA_DARWIN_ARM64/${{ steps.sha.outputs.darwin_arm64 }}/g" Formula/xp.rb
          sed -i "s/SHA_DARWIN_X64/${{ steps.sha.outputs.darwin_x64 }}/g" Formula/xp.rb
          sed -i "s/SHA_LINUX_X64/${{ steps.sha.outputs.linux_x64 }}/g" Formula/xp.rb
          sed -i "s/SHA_LINUX_ARM64/${{ steps.sha.outputs.linux_arm64 }}/g" Formula/xp.rb

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' Formula/xp.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/xp.rb
          git commit -m "Update xp to ${{ github.event.release.tag_name }}"
          git push
